<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Contact Form</title>
    <link crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          referrerpolicy="no-referrer" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="container">

    <div class="form-container">
        <h1>Get in Touch</h1>
        <p>Fill out the form below to contact us.</p>
        <form>
            <div class="input-group">
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input placeholder="Name" required type="text">
                </div>

                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input placeholder="Email" required type="email">
                </div>

                <div class="input-field">
                    <i class="fas fa-phone"></i>
                    <input placeholder="Phone (optional)" type="tel">
                </div>

                <div class="input-field">
                    <i class="fas fa-tag"></i>
                    <input placeholder="Subject" required type="text">
                </div>


            </div>
            <div class="message-field">
                <i class="fas fa-message"></i>
                <textarea placeholder="Your Message" required></textarea>
            </div>
            <button type="submit">
                <div class="btn-content">
                    <span>Send Message</span>
                    <i class="fas fa-paper-plane"></i>
                </div>
            </button>
        </form>

        <div class="contact-info">
            <div class="info-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>123 Main Street, Manhattan, New York, USA</span>
            </div>
            <div class="info-item">
                <i class="fas fa-envelope"></i>
                <span>contact@example.com</span>
            </div>
            <div class="info-item">
                <i class="fas fa-phone"></i>
                <span>+1 234 567 8900</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
