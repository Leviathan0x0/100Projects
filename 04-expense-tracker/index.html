<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Expense Tracker</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Expense Tracker</h1>

    <div class="balance-container">
        <h2>Your Balance</h2>
        <h1 id="balance">$0.00</h1>

        <div class="summary">
            <div class="income">
                <h3>Income</h3>
                <p id="income-amount">$0.00</p>
            </div>
            <div class="expenses">
                <h3>Expenses</h3>
                <p id="expense-amount">$0.00</p>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="transaction-container">
            <h2>Transactions</h2>
            <ul id="transaction-list">

            </ul>
        </div>

        <div class="form-container">
            <h2>Add New Transaction</h2>

            <form id="transaction-form">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input id="description" placeholder="Enter description..." required type="text"/>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input id="amount" placeholder="Enter amount..." required type="number"/>
                    <small>Use negative (-) for expenses</small>
                </div>

                <button type="submit">Add Transaction</button>
            </form>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
