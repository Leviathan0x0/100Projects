<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" name="viewport" />
		<meta content="ie=edge" http-equiv="X-UA-Compatible" />
		<link href="style.css" rel="stylesheet" />
		<link
			crossorigin="anonymous"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
			integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
			referrerpolicy="no-referrer"
			rel="stylesheet"
		/>
		<script defer src="script.js"></script>
		<title>Calculator</title>
	</head>
	<body>
		<div class="calculator dark">
			<div class="theme-toggle">
				<div class="light active">
					<i class="fas fa-sun"></i>
				</div>
				<div class="dark">
					<i class="far fa-moon"></i>
				</div>
			</div>
			<div class="display">
				<div class="calculation"></div>
				<input class="result" disabled placeholder="0" />
			</div>
			<div class="keypad">
				<div class="key-row">
					<button class="top all-clear">AC</button>
					<button class="top clear">C</button>
					<button class="top operations" id="percent">%</button>
					<button class="operations" id="divide">÷</button>
				</div>

				<div class="key-row">
					<button class="number">7</button>
					<button class="number">8</button>
					<button class="number">9</button>
					<button class="operations" id="multiply">×</button>
				</div>

				<div class="key-row">
					<button class="number">4</button>
					<button class="number">5</button>
					<button class="number">6</button>
					<button class="operations" id="subtract">-</button>
				</div>

				<div class="key-row">
					<button class="number">1</button>
					<button class="number">2</button>
					<button class="number">3</button>
					<button class="operations" id="add">+</button>
				</div>

				<div class="key-row">
					<button class="backspace"><i class="fas fa-backspace"></i></button>
					<button class="number">0</button>
					<button class="decimal">.</button>
					<button id="equal">=</button>
				</div>
			</div>
		</div>
	</body>
</html>
