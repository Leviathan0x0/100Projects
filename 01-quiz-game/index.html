<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <link href="style.css" rel="stylesheet">
    <title>Quiz Game</title>
</head>
<body>
<div class="container">
    <div class="screen active" id="start-screen">
        <h1>Quiz Time</h1>
        <p>Test your knowledge with these fun questions!</p>
        <button id="start-btn">Start Quiz</button>
    </div>

    <div class="screen" id="quiz-screen">
        <div class="quiz-header">
            <h2 id="question-text">Question</h2>
            <div class="quiz-info">
                <p>
                    Question <span id="current-question">1</span> of <span id="total-questions">5</span>
                </p>
                <p>
                    Score: <span id="score">0</span>
                </p>
            </div>
        </div>
        <div class="answers-container" id="answers-container">

        </div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>
    <div class="screen" id="result-screen">
        <h1>Quiz Results</h1>
        <div class="result-info">
            <p>Your final score is: <span id="final-score">0</span> out of <span id="max-score">5</span></p>
            <div class="result-message" id="result-message">Good Job!</div>
        </div>
        <button id="restart-btn">Restart Quiz</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
