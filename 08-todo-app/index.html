<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>To-Do List</title>
    <link crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          referrerpolicy="no-referrer" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="app">
    <header>
        <h1>
            <i class="fas fa-check-circle"></i>
            My Tasks
        </h1>
        <p id="date"></p>
    </header>

    <div class="todo-input">
        <input id="task-input" name="task-input" placeholder="What do you need to do?" type="text">
        <button id="add-task">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div class="filters">
        <span class="filter active" data-filter="all"> All </span>
        <span class="filter" data-filter="active"> Active </span>
        <span class="filter" data-filter="completed"> Completed </span>
    </div>

    <div class="todos-container">
        <ul class="todos-list">
            <!--            INSERTED DYNAMICALLY-->
        </ul>
        <div class="empty-state hidden">
            <i class="fas fa-clipboard-list"></i>
            <p>No tasks here yet.</p>
        </div>
    </div>

    <footer>
        <p id="items-left">0 items left</p>
        <button id="clear-completed">Clear Completed</button>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
