<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<link href="./assets/images/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png" />
		<link href="style.css" rel="stylesheet" />
		<link
			crossorigin="anonymous"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
			integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
			referrerpolicy="no-referrer"
			rel="stylesheet"
		/>
		<title>Results Summary UI</title>
	</head>
	<body>
		<div class="container">
			<div class="result-panel">
				<h3 class="result-header">Your Result</h3>
				<div class="result-score">
					<h1 class="average-score">76</h1>
					<p class="total-score">of 100</p>
				</div>
				<h2 class="remark">Great</h2>
				<p class="description">You scored higher than 65% of the people who have taken these tests.</p>
			</div>

			<div class="summary-panel">
				<h3 class="summary-header">Summary</h3>
				<div class="summary-items">
					<div class="summary-item reaction">
						<img alt="reaction" class="icon" src="assets/images/icon-reaction.svg" />
						<span class="skill-name">Reaction</span>
						<p class="score-container"><span class="score">80</span>‎ / 100</p>
					</div>
					<div class="summary-item memory">
						<img alt="memory" class="icon" src="assets/images/icon-memory.svg" />
						<span class="skill-name">Memory</span>
						<p class="score-container"><span class="score">92</span>‎ / 100</p>
					</div>
					<div class="summary-item verbal">
						<img alt="verbal" class="icon" src="assets/images/icon-verbal.svg" />
						<span class="skill-name">Verbal</span>
						<p class="score-container"><span class="score">60</span>‎ / 100</p>
					</div>
					<div class="summary-item visual">
						<img alt="visual" class="icon" src="assets/images/icon-visual.svg" />
						<span class="skill-name">Visual</span>
						<p class="score-container"><span class="score">73</span>‎ / 100</p>
					</div>
				</div>
				<button type="button">Continue</button>
			</div>
		</div>
	</body>
</html>
